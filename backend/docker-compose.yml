services:
  shb-agents:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_MODE: rules
      BIND_HOST: 0.0.0.0
      ALLOWED_CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 10
