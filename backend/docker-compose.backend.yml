      KAFKA_SASL_PASSWORD: ${KAFKA_COMPLIANCE_WORKER_PASSWORD:?Generate infra/.env.local}
      KAFKA_CLIENT_ID: compliance-worker
      KAFKA_CONSUMER_GROUP: compliance-worker-group
      MINIO_ACCESS_KEY: ""
