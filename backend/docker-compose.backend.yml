      KAFKA_SASL_USERNAME: ${KAFKA_CREDIT_WORKER_USERNAME:-credit-worker}
      KAFKA_SASL_PASSWORD: ${KAFKA_CREDIT_WORKER_PASSWORD:?Generate infra/.env.local}
      KAFKA_CLIENT_ID: credit-worker
      KAFKA_CONSUMER_GROUP: credit-worker-group
      MINIO_ACCESS_KEY: ""
      MINIO_SECRET_KEY: ""
    networks: [bank-application, bank-data]
    depends_on:
      backend-api:
        condition: service_healthy
    security_opt: [no-new-privileges:true]

  backend-compliance-worker:
    image: bank-ai-backend:0.1.0
    profiles: [backend-workers]
