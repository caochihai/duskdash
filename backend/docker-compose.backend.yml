      <<: *document-worker-environment
      KAFKA_SASL_USERNAME: ${KAFKA_NOTIFICATION_GATEWAY_USERNAME:-notification-gateway}
      KAFKA_SASL_PASSWORD: ${KAFKA_NOTIFICATION_GATEWAY_PASSWORD:?Generate infra/.env.local}
      KAFKA_CLIENT_ID: notification-gateway
      KAFKA_CONSUMER_GROUP: notification-gateway-group
      MINIO_ACCESS_KEY: ""
