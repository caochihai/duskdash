  backend-report-worker:
    image: bank-ai-backend:0.1.0
    profiles: [backend-workers]
    command: ["python", "-m", "app.workers.report_worker"]
    restart: unless-stopped
    environment:
      <<: *document-worker-environment
      KAFKA_SASL_USERNAME: ${KAFKA_REPORT_WORKER_USERNAME:-report-worker}
      KAFKA_SASL_PASSWORD: ${KAFKA_REPORT_WORKER_PASSWORD:?Generate infra/.env.local}
      KAFKA_CLIENT_ID: report-worker
      KAFKA_CONSUMER_GROUP: report-worker-group
      MINIO_ACCESS_KEY: ${MINIO_REPORT_WORKER_ACCESS_KEY:-report-worker}
      MINIO_SECRET_KEY: ${MINIO_REPORT_WORKER_SECRET_KEY:?Generate infra/.env.local}
    networks: [bank-application, bank-data]
    depends_on:
      backend-api:
