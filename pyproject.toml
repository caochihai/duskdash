[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "duskdash-credit-agent"
version = "0.1.0"
description = "DuskDash credit agent prototype for SME credit renewal assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
]

[project.urls]
Homepage = "https://github.com/caochihai/duskdash"
Repository = "https://github.com/caochihai/duskdash"
Issues = "https://github.com/caochihai/duskdash/issues"

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]
dev = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "pytest>=8,<10",
]
eval = [
    "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
credit_agent = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
