[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-assessment-agent"
version = "0.2.0"
description = "Deterministic, auditable credit document assessment microservice"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.133,<1",
  "starlette>=1.0.1,<2",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "anthropic>=0.49,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7"]
ocr = ["Pillow>=10,<12", "pypdf>=5,<6", "easyocr>=1.7,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.policy" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
