pg_slow_queries:
  query: |
    SELECT
      COALESCE(datname, 'unknown') AS database,
      COUNT(*)::BIGINT AS count,
      COALESCE(MAX(EXTRACT(EPOCH FROM (CURRENT_TIMESTAMP - query_start))), 0)::DOUBLE PRECISION AS max_seconds
    FROM pg_catalog.pg_stat_activity
    WHERE state = 'active'
      AND pid <> pg_catalog.pg_backend_pid()
      AND query_start < CURRENT_TIMESTAMP - INTERVAL '1 second'
    GROUP BY COALESCE(datname, 'unknown')
  metrics:
    - database:
        usage: LABEL
        description: Database containing an active query over one second.
    - count:
        usage: GAUGE
        description: Number of active queries running longer than one second.
    - max_seconds:
        usage: GAUGE
        description: Age in seconds of the longest active query over one second.
