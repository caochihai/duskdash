# Rendered by scripts/start-kafka.sh. This template intentionally contains no
# credential. Do not mount it directly as Kafka's active configuration.

process.roles=broker,controller
node.id=__KAFKA_NODE_ID__
controller.quorum.voters=__KAFKA_NODE_ID__@kafka:9093
controller.listener.names=CONTROLLER

listeners=INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
advertised.listeners=INTERNAL://kafka:9092,EXTERNAL://__KAFKA_EXTERNAL_HOST__:29092
listener.security.protocol.map=INTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
inter.broker.listener.name=INTERNAL

sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512

authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:__KAFKA_ADMIN_USERNAME__;User:ANONYMOUS
early.start.listeners=CONTROLLER

log.dirs=__KAFKA_DATA_DIR__
metadata.log.dir=__KAFKA_DATA_DIR__
num.partitions=3
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0

auto.create.topics.enable=false
delete.topic.enable=true
unclean.leader.election.enable=false
message.max.bytes=1048576
replica.fetch.max.bytes=1048576

