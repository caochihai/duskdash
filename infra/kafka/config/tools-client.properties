# Non-secret settings copied by scripts/common.sh when it renders a client
# configuration. The SCRAM username and password are appended only at runtime
# to a mode-0600 file under /tmp/bank-kafka.
security.protocol=SASL_PLAINTEXT
sasl.mechanism=SCRAM-SHA-512
client.dns.lookup=use_all_dns_ips
request.timeout.ms=30000
default.api.timeout.ms=30000

